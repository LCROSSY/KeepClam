name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write   # artifact attestation
  contents: write
  attestations: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-and-test
        env:
          KEEPCLAM_VERSION: ${{ github.ref_name }}

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/bin/ditto -c -k --norsrc --noextattr --keepParent build/KeepClam.app "KeepClam-${VERSION}.zip"
          shasum -a 256 "KeepClam-${VERSION}.zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: KeepClam-*.zip

      - name: Upload release artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            KeepClam-*.zip
            SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
