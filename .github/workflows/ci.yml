name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/build-and-test

      - name: Verify signature
        run: codesign --verify --strict --verbose=2 build/KeepClam.app

      - name: Sanity-check bundle
        run: |
          plutil -lint build/KeepClam.app/Contents/Info.plist
          test "$(plutil -extract CFBundleExecutable raw build/KeepClam.app/Contents/Info.plist)" = "KeepClam"
          test "$(plutil -extract CFBundleShortVersionString raw build/KeepClam.app/Contents/Info.plist)" != ""
          test "$(plutil -extract CFBundleVersion raw build/KeepClam.app/Contents/Info.plist)" != ""
          test "$(plutil -extract LSMinimumSystemVersion raw build/KeepClam.app/Contents/Info.plist)" = "13.0"
