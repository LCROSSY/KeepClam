name: Build and test
description: Builds KeepClam.app and checks app behavior and the installer. KEEPCLAM_VERSION overrides the bundled version (tag builds strip a leading "v").
runs:
  using: composite
  steps:
    - name: Build app
      shell: bash
      run: zsh scripts/build-native.command

    - name: Run unit tests
      shell: bash
      run: |
        clang -fobjc-arc -framework Cocoa -framework IOKit -framework UserNotifications -framework ServiceManagement -framework Security \
          Sources/LogTests.m -o build/LogTests
        ./build/LogTests

    - name: Test scoped uninstall and failure handling
      shell: bash
      run: |
        clang -fobjc-arc -mmacosx-version-min=13.0 -framework Foundation Sources/UninstallTests.m -o build/UninstallTests
        ./build/UninstallTests
        clang -fobjc-arc -mmacosx-version-min=13.0 -framework Cocoa -framework IOKit -framework UserNotifications -framework ServiceManagement -framework Security Sources/UninstallFlowTests.m -o build/UninstallFlowTests
        ./build/UninstallFlowTests

    - name: Test installer
      shell: bash
      run: |
        bash -n scripts/install.sh
        LC_ALL=en_US.UTF-8 python3 scripts/test-install.py
